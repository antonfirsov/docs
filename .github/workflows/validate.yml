name: Validate

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
 
    - name: Clone repo with full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # We need the full history in order to figure
                       # out which files we need to validate.

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore tools/blog-tools.sln

    - name: Build
      run: dotnet build tools/blog-tools.sln --configuration Release --no-restore --nologo

    - name: Validate
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}  
        COMMIT_ID: ${{github.event.pull_request.head.sha}}
        AUTHORS_LIST_URL: ${{secrets.AUTHORS_LIST_URL}}
      run: dotnet run --project tools/blog-validate/blog-validate.csproj -- . --categories categories.txt --base-ref $GITHUB_BASE_REF --ref $GITHUB_SHA
